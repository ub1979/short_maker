[project]
name = "short-maker"
version = "0.1.0"
description = "Turn long 16:9 videos into vertical shorts for YouTube Shorts, Reels and TikTok"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
package = false
